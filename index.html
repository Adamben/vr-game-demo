<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dog Cam Viewer</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
  video { width: 90%; max-width: 600px; margin-top: 30px; border-radius: 12px; border: 2px solid #333; background: #000; }
  input, button { padding: 8px 12px; margin: 5px; font-size: 16px; }
  #status { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>
  <h1>🐶 Dog Cam Viewer</h1>
  <input type="text" id="targetPeerId" placeholder="Enter computer's peer ID" />
  <button id="connectBtn">Connect</button>
  <video id="remoteVideo" autoplay playsinline></video>
  <p id="status">Enter the computer's peer ID above.</p>

  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <script>
    const remoteVideo = document.getElementById('remoteVideo');
    const status = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');
    const targetPeerIdInput = document.getElementById('targetPeerId');
    let peer;

    connectBtn.addEventListener('click', () => {
      const targetPeerId = targetPeerIdInput.value.trim();
      if (!targetPeerId) return alert("Please enter the computer's peer ID.");

      peer = new Peer({
        host: '0.peerjs.com',
        port: 443,
        path: '/',
        secure: true
      });

      peer.on('open', id => {
        console.log('Viewer peer ID:', id);
        status.textContent = 'Connecting to computer...';

        const call = peer.call(targetPeerId, null);
        call.on('stream', stream => {
          remoteVideo.srcObject = stream;
          status.textContent = `Connected! Viewing ${targetPeerId}`;
        });

        call.on('error', err => {
          console.error(err);
          status.textContent = 'Connection error.';
        });
      });

      peer.on('error', err => {
        console.error(err);
        status.textContent = 'PeerJS error: ' + err;
      });
    });
  </script>
</body>
</html>
