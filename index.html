<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dog Cam Streamer - Debug</title>
<style>
body { font-family: monospace; text-align: center; background: #f5f5f5; }
video { width: 80%; max-width: 600px; margin-top: 20px; border-radius: 12px; border: 2px solid #333; background: #000; }
#peerIdDisplay { font-weight: bold; margin-top: 10px; }
#status { margin-top: 10px; font-weight: bold; }
#log { text-align: left; margin: 10px auto; width: 90%; max-width: 600px; height: 200px; overflow-y: auto; border: 1px solid #333; padding: 5px; background: #fff; }
button { margin-top: 5px; padding: 5px 10px; }
</style>
</head>
<body>
<h1>🐶 Dog Cam Streamer (Debug)</h1>
<video id="localVideo" autoplay muted playsinline></video>
<p id="peerIdDisplay">Peer ID: generating...</p>
<p id="status">Waiting for viewers...</p>
<div>
<button id="clearLog">Clear Log</button>
</div>
<div id="log"></div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
const localVideo = document.getElementById('localVideo');
const peerIdDisplay = document.getElementById('peerIdDisplay');
const status = document.getElementById('status');
const logDiv = document.getElementById('log');
const clearLogBtn = document.getElementById('clearLog');

function log(msg) {
    console.log(msg);
    logDiv.innerHTML += msg + '<br>';
    logDiv.scrollTop = logDiv.scrollHeight;
}

clearLogBtn.onclick = () => { logDiv.innerHTML = ''; };

const peer = new Peer({
    host: '0.peerjs.com',
    port: 443,
    path: '/',
    secure: true
});

peer.on('open', id => {
    peerIdDisplay.textContent = `Peer ID: ${id}`;
    log(`[OPEN] Peer created with ID: ${id}`);
});

peer.on('call', call => {
    log(`[CALL] Incoming call from ${call.peer}`);
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            localVideo.srcObject = stream;
            call.answer(stream);
            status.textContent = `Connected to viewer: ${call.peer}`;
            log(`[STREAM] Webcam stream sent to ${call.peer}`);
